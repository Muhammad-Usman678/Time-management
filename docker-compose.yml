# Optional: one-command PostgreSQL for the production-style stack.
# Usage:
#   docker compose up -d
#   # then set DATABASE_PROVIDER=postgresql and DATABASE_URL in .env
services:
  db:
    image: postgres:16-alpine
    container_name: momentum_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: momentum
      POSTGRES_DB: momentum
    ports:
      - "5432:5432"
    volumes:
      - momentum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum -d momentum"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  momentum_pgdata:
